{% extends 'base.html' %}
{% load core_extras %}

{% block title %}Today's Attendance - E-Attendance{% endblock %}

{% block page-title %}Today's Attendance{% endblock %}

{% block auth_content %}
{# No inline <style> here any more. This page used to carry its own 70-line
   block of Bootstrap 4 hex values - a blue card header, five differently
   coloured left borders and a timeline - none of which followed the palette or
   dark mode. Everything it needs now lives in app.css as .metric, .timeline
   and .chip. #}
<div class="page-header">
    <div>
        <h2 class="page-header__title">Today's attendance</h2>
        <p class="page-header__subtitle">{{ today|date:"l, j F Y" }}</p>
    </div>
    <div class="page-header__actions">
        <a href="{% url 'devices:device_list' %}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-cpu" aria-hidden="true"></i> Devices
        </a>
        <a href="{% url 'attendance_calendar' %}" class="btn btn-sm btn-outline-primary">
            <i class="bi bi-calendar3" aria-hidden="true"></i> Calendar
        </a>
    </div>
</div>

{# Five equal columns at desktop width. The old markup used col-lg-2-4, a class
   Bootstrap does not define and nothing here declared, so the cards silently
   fell back to half-width rows. #}
<div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3 mb-4">
    <div class="col">
        <div class="metric">
            <div>
                <div class="metric__label">Total employees</div>
                <div class="metric__value">{{ stats.total_employees }}</div>
            </div>
            <div class="metric__icon metric__icon--neutral" aria-hidden="true"><i class="bi bi-people"></i></div>
        </div>
    </div>
    <div class="col">
        <div class="metric">
            <div>
                <div class="metric__label">Present</div>
                <div class="metric__value">{{ stats.present }}</div>
            </div>
            <div class="metric__icon metric__icon--success" aria-hidden="true"><i class="bi bi-check-circle"></i></div>
        </div>
    </div>
    <div class="col">
        <div class="metric">
            <div>
                <div class="metric__label">Late</div>
                <div class="metric__value">{{ stats.late }}</div>
            </div>
            <div class="metric__icon metric__icon--warning" aria-hidden="true"><i class="bi bi-clock"></i></div>
        </div>
    </div>
    <div class="col">
        <div class="metric">
            <div>
                <div class="metric__label">Absent</div>
                <div class="metric__value">{{ stats.absent }}</div>
            </div>
            <div class="metric__icon metric__icon--danger" aria-hidden="true"><i class="bi bi-x-circle"></i></div>
        </div>
    </div>
    <div class="col">
        <div class="metric">
            <div>
                <div class="metric__label">Pending</div>
                <div class="metric__value">{{ stats.pending }}</div>
            </div>
            <div class="metric__icon metric__icon--info" aria-hidden="true"><i class="bi bi-hourglass-split"></i></div>
        </div>
    </div>
</div>

<div class="row g-4">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-clock-history" aria-hidden="true"></i>
                <span class="card-title">Recent activity</span>
                <span class="ms-auto chip chip--neutral">Last {{ recent_activity.count }} punches</span>
            </div>
            <div class="card-body">
                {% if recent_activity %}
                    <div class="timeline">
                        {% for attendance in recent_activity %}
                        <div class="timeline__item {% if attendance.punch_type|punch_is_in %}timeline__item--in{% else %}timeline__item--out{% endif %}">
                            <div class="timeline__time">
                                <i class="bi bi-clock" aria-hidden="true"></i>{{ attendance.timestamp|date:"H:i:s" }}
                            </div>
                            <div class="d-flex align-items-center gap-2 flex-wrap mt-1">
                                {% if attendance.employee.user.profile_picture %}
                                    <img src="{{ attendance.employee.user.profile_picture.url }}"
                                         class="avatar avatar--sm" alt="">
                                {% else %}
                                    <span class="avatar avatar--sm" aria-hidden="true">{{ attendance.employee.user|initials }}</span>
                                {% endif %}
                                <strong>{{ attendance.employee.user.get_full_name }}</strong>
                                <span class="chip {% if attendance.punch_type|punch_is_in %}chip--success{% else %}chip--danger{% endif %}">
                                    {{ attendance.get_punch_type_display }}
                                </span>
                            </div>
                            <div class="d-flex align-items-center gap-2 flex-wrap mt-2">
                                <span class="chip chip--neutral">
                                    <i class="bi bi-cpu" aria-hidden="true"></i>{{ attendance.device.name }}
                                </span>
                                {% if attendance.device.location %}
                                    <span class="chip chip--neutral">
                                        <i class="bi bi-geo-alt" aria-hidden="true"></i>{{ attendance.device.location }}
                                    </span>
                                {% endif %}
                                <small class="text-muted mono">UID {{ attendance.uid }}</small>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                {% else %}
                    <div class="empty-state">
                        <div class="empty-state__icon" aria-hidden="true"><i class="bi bi-clock-history"></i></div>
                        <p class="empty-state__title">No activity yet today</p>
                        <p class="empty-state__text mb-0">
                            Punches appear here within seconds of someone scanning at a terminal.
                        </p>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>

    <div class="col-lg-5">
        <div class="card mb-4">
            <div class="card-header">
                <i class="bi bi-cpu" aria-hidden="true"></i>
                <span class="card-title">Activity by device</span>
            </div>
            {% if device_stats %}
            <div class="card-body table-card p-0">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th scope="col">Device</th>
                                <th scope="col" class="text-end">Punches</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for device in device_stats %}
                            <tr>
                                <td>
                                    <strong>{{ device.device__name }}</strong>
                                    {% if device.device__location %}
                                        <div class="text-muted small">{{ device.device__location }}</div>
                                    {% endif %}
                                </td>
                                <td class="text-end tabular">{{ device.count }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
            {% else %}
            <div class="card-body">
                <div class="empty-state py-4">
                    <div class="empty-state__icon" aria-hidden="true"><i class="bi bi-cpu"></i></div>
                    <p class="empty-state__title">No device activity</p>
                    <p class="empty-state__text mb-0">No terminal has reported a punch today.</p>
                </div>
            </div>
            {% endif %}
        </div>

        <div class="card">
            <div class="card-header">
                <i class="bi bi-list-check" aria-hidden="true"></i>
                <span class="card-title">Daily summary</span>
                <span class="ms-auto chip chip--neutral">{{ daily_attendances.count }}</span>
            </div>
            {% if daily_attendances %}
            <div class="card-body table-card p-0">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th scope="col">Employee</th>
                                <th scope="col">Status</th>
                                <th scope="col">In</th>
                                <th scope="col" class="text-end">Hours</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for daily in daily_attendances %}
                            <tr>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        {% if daily.employee.user.profile_picture %}
                                            <img src="{{ daily.employee.user.profile_picture.url }}"
                                                 class="avatar avatar--sm" alt="">
                                        {% else %}
                                            <span class="avatar avatar--sm" aria-hidden="true">{{ daily.employee.user|initials }}</span>
                                        {% endif %}
                                        <div>
                                            <strong>{{ daily.employee.user.get_full_name }}</strong>
                                            <div class="text-muted small mono">{{ daily.employee.employee_id }}</div>
                                        </div>
                                    </div>
                                </td>
                                {# The chip carries a text label as well as a tint, so status is
                                   never conveyed by colour alone. #}
                                <td>{% status_badge daily.status daily.get_status_display %}</td>
                                <td class="tabular">
                                    {% if daily.check_in %}{{ daily.check_in|time:"H:i" }}{% else %}<span class="text-muted">&mdash;</span>{% endif %}
                                </td>
                                <td class="text-end tabular">
                                    {% if daily.working_hours %}{{ daily.working_hours|floatformat:1 }}{% else %}<span class="text-muted">&mdash;</span>{% endif %}
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
            {% else %}
            <div class="card-body">
                <div class="empty-state py-4">
                    <div class="empty-state__icon" aria-hidden="true"><i class="bi bi-list-check"></i></div>
                    <p class="empty-state__title">No summaries yet</p>
                    <p class="empty-state__text mb-0">
                        Daily records are rolled up as punches arrive.
                    </p>
                </div>
            </div>
            {% endif %}
        </div>
    </div>
</div>

{# The full log. The timeline above is the live feed - the newest twenty, read
   at a glance. This is the record: every punch of the day, in order, with the
   device that reported it. #}
<div class="card mt-4">
    <div class="card-header">
        <i class="bi bi-journal-text" aria-hidden="true"></i>
        <span class="card-title">All punches today</span>
        <span class="ms-auto chip chip--neutral">
            {{ page_obj.paginator.count }} punch{{ page_obj.paginator.count|pluralize:"es" }}
        </span>
    </div>

    {% if page_obj.paginator.count %}
    <div class="card-body table-card p-0">
        <div class="table-responsive">
            <table class="table table-hover">
                <caption class="visually-hidden">
                    Every attendance punch recorded today, newest first
                </caption>
                <thead>
                    <tr>
                        <th scope="col">Time</th>
                        <th scope="col">Employee</th>
                        <th scope="col">Punch</th>
                        <th scope="col">Device</th>
                        <th scope="col" class="text-end">UID</th>
                    </tr>
                </thead>
                <tbody>
                    {% for punch in page_obj %}
                    <tr>
                        <td class="mono tabular">{{ punch.timestamp|date:"H:i:s" }}</td>
                        <td>
                            <strong>{{ punch.employee.user.get_full_name }}</strong>
                            <div class="text-muted small mono">{{ punch.employee.employee_id }}</div>
                        </td>
                        {# Label as well as tint, so the punch direction is never
                           carried by colour alone. #}
                        <td>
                            <span class="chip {% if punch.punch_type|punch_is_in %}chip--success{% else %}chip--danger{% endif %}">
                                {{ punch.get_punch_type_display }}
                            </span>
                        </td>
                        <td>
                            {{ punch.device.name }}
                            {% if punch.device.location %}
                                <div class="text-muted small">{{ punch.device.location }}</div>
                            {% endif %}
                        </td>
                        <td class="text-end mono tabular">{{ punch.uid }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    {% if page_obj.has_other_pages %}
    <div class="card-body border-top">
        <nav class="d-flex justify-content-between align-items-center" aria-label="Punch log pages">
            <p class="small text-muted mb-0">
                Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
            </p>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}">
                    {% if page_obj.has_previous %}
                        <a class="page-link" href="?page={{ page_obj.previous_page_number }}">Previous</a>
                    {% else %}
                        <span class="page-link" aria-disabled="true">Previous</span>
                    {% endif %}
                </li>
                <li class="page-item {% if not page_obj.has_next %}disabled{% endif %}">
                    {% if page_obj.has_next %}
                        <a class="page-link" href="?page={{ page_obj.next_page_number }}">Next</a>
                    {% else %}
                        <span class="page-link" aria-disabled="true">Next</span>
                    {% endif %}
                </li>
            </ul>
        </nav>
    </div>
    {% endif %}

    {% else %}
    <div class="card-body">
        <div class="empty-state py-4">
            <div class="empty-state__icon" aria-hidden="true"><i class="bi bi-journal-text"></i></div>
            <p class="empty-state__title">Nothing recorded today</p>
            <p class="empty-state__text mb-0">
                Punches appear here as soon as a terminal reports them.
            </p>
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}
