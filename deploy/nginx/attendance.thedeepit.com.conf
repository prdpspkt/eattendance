# E-Attendance - nginx site configuration (behind Cloudflare Tunnel)
#
# TLS terminates at Cloudflare, so this origin serves plain HTTP on port 80 and
# holds no certificates. cloudflared must point at nginx, not at gunicorn:
#
#   ingress:
#     - hostname: attendance.thedeepit.com
#       service: http://localhost:80
#     - service: http_status:404
#
# Pointing the tunnel straight at :8001 bypasses everything below, including
# the /media/ handling and the /iclock/ rate limit.
#
# Install:
#   sudo cp deploy/nginx/attendance.thedeepit.com.conf \
#           /etc/nginx/sites-available/attendance.thedeepit.com
#   sudo ln -s /etc/nginx/sites-available/attendance.thedeepit.com \
#              /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/attendance     # drop the older config
#   sudo nginx -t && sudo systemctl reload nginx

upstream eattendance {
    # Must match the --bind in /etc/systemd/system/attendance.service,
    # which runs gunicorn as the "deepit" user on port 8001.
    server 127.0.0.1:8001;

    # Reuse upstream connections instead of opening a TCP connection per
    # request. At a few thousand requests per second the connect/close pair is
    # a real cost on both sides and, worse, it burns ephemeral ports: without
    # this, a sustained load test exhausts the local port range and starts
    # failing with connection errors that look like the app is at its limit.
    # Requires the proxy_http_version and Connection headers set below.
    #
    # This must stay comfortably below gunicorn's own keepalive (5s).
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 4s;
}

# $forwarded_proto is defined once, host-wide, in
# /etc/nginx/conf.d/forwarded-proto.conf:
#
#   map $http_x_forwarded_proto $forwarded_proto {
#       default $http_x_forwarded_proto;
#       ""      $scheme;
#   }
#
# Cloudflare sets X-Forwarded-Proto: https, and that value is preserved rather
# than overwritten with $scheme, which is "http" on this origin leg: Django
# needs the original scheme for CSRF origin checks and request.is_secure().
# The empty-string case covers direct local requests, which send no such
# header. A map lives in the http context, so defining it here as well as in
# conf.d makes nginx fail to start with a duplicate variable.

server {
    listen 80;
    listen [::]:80;
    # The misspelling is served as an alias because people type it. Django has
    # to be told about it too, or pages render on the alias and every form on
    # them fails CSRF: set EXTRA_ALLOWED_HOSTS=attendence.thedeepit.com in
    # /etc/default/attendance.
    server_name attendance.thedeepit.com attendence.thedeepit.com;

    # No redirect to HTTPS. Cloudflare already serves the site over TLS, and a
    # redirect here would bounce every request into a loop.

    # Leave attachments and travel receipts.
    client_max_body_size 20M;

    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript image/svg+xml application/json;
    # Serve the .gz files collectstatic already wrote rather than compressing
    # the same asset again on every request.
    gzip_static     on;

    # Static files (STATIC_ROOT). WhiteNoise can serve these from inside
    # Django and still does whenever a request reaches it - which keeps the
    # app working when it is run without nginx. But a request that gets this
    # far has already cost a gunicorn worker and the whole middleware chain,
    # and a worker serving a CSS file is a worker not serving a punch. nginx
    # answers from the filesystem with none of that.
    #
    # collectstatic content-hashes the filenames, so the immutable year-long
    # cache is safe: a changed file arrives under a new URL.
    location /static/ {
        alias /var/www/attendance.thedeepit.com/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";

        # NO try_files HERE. `try_files` and `alias` do not work together:
        # nginx resolves $uri against the location root rather than the alias,
        # so it looks for /var/www/attendance.thedeepit.com/static/css/app.css
        # - with "static" doubled - never finds it, and falls through to the
        # fallback. The visible symptom is a stylesheet arriving as text/html
        # (Django's 404 page) and the browser refusing it under strict MIME
        # checking.
        #
        # Without a fallback, a file missing here is a plain 404 from nginx.
        # That is the honest failure: it means collectstatic has not been run
        # for the current code, and silently proxying it only hides that.
    }

    # Liveness probe. Kept out of the access log because it is polled
    # constantly and would otherwise dominate it.
    location = /healthz/ {
        access_log off;
        proxy_pass http://eattendance;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Uploads (MEDIA_ROOT). WhiteNoise deliberately does not serve these.
    location /media/ {
        alias /var/www/attendance.thedeepit.com-media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "private";
    }

    # ADMS/WDMS device endpoints.
    #
    # The terminals sit at remote sites and reach this server over the internet
    # on the public hostname, so this path cannot be restricted to a subnet and
    # must not be blocked at the Cloudflare side. Two consequences:
    #
    #   * Cloudflare must not force the devices onto HTTPS. ZK firmware speaks
    #     plain HTTP; a 301 from "Always Use HTTPS" leaves it retrying forever.
    #     Add a Configuration Rule scoped to /iclock/* turning that setting off,
    #     or enable HTTPS on the terminal if its firmware handles TLS properly.
    #   * The protocol has no authentication - a device is trusted on the
    #     strength of its serial number alone, and anyone who learns a serial
    #     can post punches. Compensating controls, in order of value:
    #       1. ADMS_AUTO_REGISTER_DEVICES = False once the real terminals are
    #          enrolled, so unknown serials are refused outright.
    #       2. A Cloudflare WAF rule on /iclock/* allowing only the sites'
    #          public IPs, if those are static.
    #       3. The rate limit below, which caps how fast a guessed serial can
    #          be used. Define the zone once, host-wide, in
    #          /etc/nginx/conf.d/iclock-limit.conf:
    #
    #            limit_req_zone $http_cf_connecting_ip zone=iclock:10m rate=10r/s;
    #
    #          A limit_req_zone lives in the http context, so declaring it here
    #          as well makes nginx fail to start on a duplicate zone.
    #
    # $remote_addr is the tunnel (127.0.0.1), never the terminal, so the real
    # client address is taken from Cloudflare's CF-Connecting-IP and put at the
    # front of X-Forwarded-For - which is where devices/adms.py reads it from
    # when matching a pushing device to an existing record by IP.
    # The rate limit is per client IP, so it caps how fast one guessed serial
    # number can be used - it is not a throughput limit on the site. A real
    # terminal polls every few seconds and never approaches 10 r/s. Raise the
    # zone's rate only if a single site NATs many terminals behind one address,
    # since they would then share this budget.
    location /iclock/ {
        limit_req zone=iclock burst=20 nodelay;

        proxy_pass http://eattendance;
        proxy_http_version 1.1;
        proxy_set_header Connection       "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        # Device payloads are small; take the whole body before waking a
        # worker, so a slow terminal on a bad link cannot occupy one.
        proxy_request_buffering on;
    }

    location / {
        proxy_pass http://eattendance;
        # HTTP/1.1 with an empty Connection header is what makes the upstream
        # keepalive pool above actually get used; the default HTTP/1.0 proxy
        # closes the connection after every response.
        proxy_http_version 1.1;
        proxy_set_header Connection       "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}

# Host-wide settings this site assumes, for /etc/nginx/nginx.conf. They live in
# the http/main context, so they cannot be set from this file:
#
#   worker_processes  auto;          # one per core (4 here)
#   worker_rlimit_nofile 65535;      # or workers hit the fd ceiling first
#   events {
#       worker_connections 4096;     # ceiling is workers x this, and each
#                                    # proxied request uses two (client +
#                                    # upstream)
#       multi_accept on;
#   }
#   http {
#       access_log /var/log/nginx/access.log combined buffered=64k flush=5s;
#       sendfile on;
#       tcp_nopush on;
#       tcp_nodelay on;
#       keepalive_timeout 30;
#       reset_timedout_connection on;
#   }
#
# Unbuffered access logging is a synchronous write per request; buffered=64k
# turns a few thousand of those into one.
