# E-Attendance - nginx site configuration
#
# Install:
#   sudo cp deploy/nginx/attendance.thedeepit.com.conf \
#           /etc/nginx/sites-available/attendance.thedeepit.com
#   sudo ln -s /etc/nginx/sites-available/attendance.thedeepit.com \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust before use:
#   - the device subnet in the two /iclock/ blocks
#   - the upstream address, if gunicorn listens on a socket
#   - the media alias, if MEDIA_ROOT is elsewhere

upstream eattendance {
    server 127.0.0.1:8000;
    # gunicorn --workers 3 --bind 127.0.0.1:8000 ehajiri.wsgi:application
    #
    # For a unix socket instead:
    # server unix:/run/gunicorn/eattendance.sock;
}

# ---------------------------------------------------------------------------
# Port 80
#
# Biometric terminals speak plain HTTP and most firmware cannot validate a TLS
# certificate, so /iclock/ is served here rather than redirected. Redirecting
# it would silently stop every device from delivering punches.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name attendance.thedeepit.com;

    location /iclock/ {
        # The ADMS protocol has no authentication: a device is trusted on the
        # strength of its serial number alone. Restrict this to the network the
        # terminals live on.
        allow 192.168.1.0/24;   # <-- device subnet
        allow 127.0.0.1;
        deny all;

        proxy_pass http://eattendance;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Port 443
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx < 1.25: use "listen 443 ssl http2;"
    server_name attendance.thedeepit.com;

    ssl_certificate     /etc/letsencrypt/live/attendance.thedeepit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attendance.thedeepit.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Leave attachments and travel receipts.
    client_max_body_size 20M;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript image/svg+xml application/json;

    # collectstatic writes here (STATIC_ROOT).
    # alias, not root: /static/css/app.css must map to <dir>/css/app.css.
    # Both trailing slashes are required.
    location /static/ {
        alias /var/www/attendance.thedeepit.com/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Uploads (MEDIA_ROOT). See the note in README about keeping this outside
    # STATIC_ROOT, and about who can read leave attachments.
    location /media/ {
        alias /var/www/attendance.thedeepit.com-media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "private";
    }

    location /iclock/ {
        allow 192.168.1.0/24;   # <-- device subnet
        allow 127.0.0.1;
        deny all;

        proxy_pass http://eattendance;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://eattendance;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django reads this to know the original request was HTTPS; without it
        # every POST fails CSRF verification behind TLS termination.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
