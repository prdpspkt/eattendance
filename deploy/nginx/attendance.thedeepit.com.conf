# E-Attendance - nginx site configuration (behind Cloudflare Tunnel)
#
# TLS terminates at Cloudflare, so this origin serves plain HTTP on port 80 and
# holds no certificates. cloudflared must point at nginx, not at gunicorn:
#
#   ingress:
#     - hostname: attendance.thedeepit.com
#       service: http://localhost:80
#     - service: http_status:404
#
# Pointing the tunnel straight at :8000 bypasses everything below, including
# the /media/ handling and the /iclock/ access restriction.
#
# Install:
#   sudo cp deploy/nginx/attendance.thedeepit.com.conf \
#           /etc/nginx/sites-available/attendance.thedeepit.com
#   sudo ln -s /etc/nginx/sites-available/attendance.thedeepit.com \
#              /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/attendance     # drop the older config
#   sudo nginx -t && sudo systemctl reload nginx

upstream eattendance {
    server 127.0.0.1:8000;
    # gunicorn --workers 3 --bind 127.0.0.1:8000 ehajiri.wsgi:application
    #
    # For a unix socket instead:
    # server unix:/run/gunicorn/eattendance.sock;
}

# Cloudflare sets X-Forwarded-Proto: https. Preserve it rather than
# overwriting with $scheme, which is "http" at this origin: Django needs the
# original scheme for CSRF origin checks and for request.is_secure().
# Falls back to $scheme for direct local requests, which carry no such header.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name attendance.thedeepit.com;

    # No redirect to HTTPS. Cloudflare already serves the site over TLS, and a
    # redirect here would bounce every request into a loop.

    # Leave attachments and travel receipts.
    client_max_body_size 20M;

    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript image/svg+xml application/json;

    # No /static/ block: WhiteNoise serves static files from inside Django,
    # with correct MIME types and content-hashed filenames, so /static/*
    # falls through to the proxy below.

    # Uploads (MEDIA_ROOT). WhiteNoise deliberately does not serve these.
    location /media/ {
        alias /var/www/attendance.thedeepit.com-media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "private";
    }

    # ADMS/WDMS device endpoints.
    #
    # The protocol has no authentication: a device is trusted on the strength
    # of its serial number alone. Point the terminals at this server's LAN
    # address directly so they never traverse Cloudflare, keep this restricted
    # to the network they sit on, and block /iclock/* at the Cloudflare side so
    # it is not reachable from the public hostname.
    location /iclock/ {
        allow 192.168.1.0/24;   # <-- device subnet
        allow 127.0.0.1;
        deny all;

        proxy_pass http://eattendance;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://eattendance;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
